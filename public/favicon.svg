<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background Circle with Brand Orange Gradient -->
  <defs>
    <linearGradient id="comaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A00" />
      <stop offset="100%" stop-color="#FF4800" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Round Mascot Background -->
  <circle cx="32" cy="32" r="30" fill="url(#comaGrad)" />
  <circle cx="32" cy="32" r="28" stroke="#FFE2D1" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- Cute Coffee Mug with Kawaii Mascot Face -->
  <g filter="url(#shadow)">
    <!-- Mug Body -->
    <rect x="18" y="24" width="24" height="22" rx="6" fill="#FFFFFF" />
    <!-- Mug Handle -->
    <path d="M42 28 C47 28 47 38 42 38" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none" />
    
    <!-- Cute Eyes -->
    <ellipse cx="25" cy="33" rx="2" ry="2.5" fill="#18181B" />
    <ellipse cx="35" cy="33" rx="2" ry="2.5" fill="#18181B" />
    <!-- Eye Highlights -->
    <circle cx="26" cy="32" r="0.8" fill="#FFFFFF" />
    <circle cx="36" cy="32" r="0.8" fill="#FFFFFF" />

    <!-- Cute Cheeks (Blush) -->
    <ellipse cx="22.5" cy="36" rx="2" ry="1.2" fill="#FF758F" opacity="0.85" />
    <ellipse cx="37.5" cy="36" rx="2" ry="1.2" fill="#FF758F" opacity="0.85" />

    <!-- Cute Smiling Mouth -->
    <path d="M28.5 36 Q30 38.5 31.5 36" stroke="#18181B" stroke-width="1.5" stroke-linecap="round" fill="none" />

    <!-- Coffee Liquid inside rim -->
    <ellipse cx="30" cy="24" rx="10" ry="2.5" fill="#6F4E37" />
  </g>

  <!-- Steaming Heart (Love & Specialty Coffee) -->
  <path d="M30 18 C30 14 26 12 26 15 C26 17.5 30 20 30 20 C30 20 34 17.5 34 15 C34 12 30 14 30 18 Z" fill="#FFE2D1" />
  <!-- Sparkles -->
  <path d="M44 14 L45 17 L48 18 L45 19 L44 22 L43 19 L40 18 L43 17 Z" fill="#FFD54F" />
</svg>
